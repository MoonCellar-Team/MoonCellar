server {
  server_name status.mooncellar.space;

  # the project status hub: the web app answers this host with its /status routes, admins only
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_pass http://frontend;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/mooncellar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mooncellar.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name play.mooncellar.space;

  # a game port in the browser: static files from .github/workflows/play.yml, the game service under /game-api/;
  # wasm threads need the page cross-origin isolated
  root /opt/mooncellar/play/current;
  index index.html;
  client_max_body_size 8m;

  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cache-Control "no-cache" always;

  location = /game-api/signal {
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_pass http://game/signal;
  }

  location /game-api/ {
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_pass http://game/;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/mooncellar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mooncellar.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  listen 80;
  server_name
    mooncellar.space
    api.mooncellar.space
    game.mooncellar.space
    docs.mooncellar.space
    storybook.mooncellar.space
    grafana.mooncellar.space
    cockpit.mooncellar.space
    portainer.mooncellar.space
    status.mooncellar.space
    play.mooncellar.space;
  return 301 https://$host$request_uri;
}
