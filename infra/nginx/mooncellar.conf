map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream frontend {
  server 127.0.0.1:3111;
  keepalive 32;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

upstream api {
  server 127.0.0.1:3228;
  keepalive 16;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

upstream game {
  server 127.0.0.1:3229;
  keepalive 16;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

upstream docs {
  server 127.0.0.1:4333;
  keepalive 8;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

upstream storybook {
  server 127.0.0.1:4222;
  keepalive 8;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

upstream grafana {
  server 127.0.0.1:3000;
  keepalive 16;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

upstream cockpit {
  server 127.0.0.1:9090;
  keepalive 16;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

upstream portainer {
  server 127.0.0.1:9443;
  keepalive 16;
  keepalive_timeout 20s;
  keepalive_requests 100;
}

server {
  server_name mooncellar.space;

  location / {
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_pass http://frontend;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/mooncellar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mooncellar.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
  server_name api.mooncellar.space;

  client_max_body_size 8m;

  location /socket.io/ {
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_pass http://api;
  }

  location / {
    include proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_pass http://api;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/mooncellar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mooncellar.space/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

