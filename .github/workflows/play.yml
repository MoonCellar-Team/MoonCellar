name: Play

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Glassline release whose browser build goes to play.mooncellar.space
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Download the browser build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [[ "$TAG" =~ ^[0-9A-Za-z._-]+$ ]]
          gh release download "$TAG" -R MoonCellar-Team/Glassline -p 'glassline-web*.zip' -O play.zip
          mkdir play
          unzip -q play.zip -d play
          test -f play/index.html
          tar -czf play.tar.gz -C play .

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "play.tar.gz"
          target: "/tmp/"

      - name: Publish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG
          script: |
            set -e
            DIR=/opt/mooncellar/play
            mkdir -p "$DIR/releases"
            rm -rf "$DIR/releases/$TAG"
            mkdir "$DIR/releases/$TAG"
            tar -xzf /tmp/play.tar.gz -C "$DIR/releases/$TAG"
            rm -f /tmp/play.tar.gz
            chmod -R a+rX "$DIR/releases/$TAG"
            ln -sfn "$DIR/releases/$TAG" "$DIR/current.new"
            mv -T "$DIR/current.new" "$DIR/current"
            ls -1dt "$DIR/releases"/* | tail -n +4 | xargs -r rm -rf
