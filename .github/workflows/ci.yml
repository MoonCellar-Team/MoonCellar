name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
      game: ${{ steps.filter.outputs.game == 'true' || github.event_name == 'workflow_dispatch' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.filter.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
      storybook: ${{ steps.filter.outputs.storybook == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect changed workspaces
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'scripts/hub-client.ts'
              - 'scripts/hub-connect.ts'
              - 'scripts/tasks.ts'
              - 'scripts/hub-connector/**'
              - 'scripts/build-hub-connector.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            game:
              - 'apps/game/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'package.json'
              - 'bun.lock'
              - 'static.Dockerfile'
              - '.github/workflows/ci.yml'
            storybook:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'static.Dockerfile'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        env:
          HUSKY: 0
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  deploy:
    needs: [changes, lint]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' ||
       needs.changes.outputs.game == 'true' ||
       needs.changes.outputs.infra == 'true' || needs.changes.outputs.docs == 'true' ||
       needs.changes.outputs.storybook == 'true')
    runs-on: ubuntu-latest

    env:
      DEPLOY_WEB: ${{ needs.changes.outputs.web }}
      DEPLOY_API: ${{ needs.changes.outputs.api }}
      DEPLOY_GAME: ${{ needs.changes.outputs.game }}
      DEPLOY_INFRA: ${{ needs.changes.outputs.infra }}
      DEPLOY_DOCS: ${{ needs.changes.outputs.docs }}
      DEPLOY_STORYBOOK: ${{ needs.changes.outputs.storybook }}
      BUILDS_IMAGES: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.game == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.storybook == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check the server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker version --format 'docker {{.Server.Version}}'
            docker compose version

      - name: Build images
        if: env.BUILDS_IMAGES == 'true'
        env:
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
        run: |
          IMAGES=""

          if [ "$DEPLOY_WEB" = "true" ]; then
            echo "${{ secrets.HOST_ENV_WEB }}" > apps/web/.env;
            docker build \
              -f apps/web/Dockerfile \
              -t mooncellar-frontend:latest \
              .
            IMAGES="$IMAGES mooncellar-frontend:latest"
          fi

          if [ "$DEPLOY_API" = "true" ]; then
            echo "${{ secrets.HOST_ENV_API }}" > apps/api/.env;
            docker build \
              -f apps/api/Dockerfile \
              -t mooncellar-backend:latest \
              .
            IMAGES="$IMAGES mooncellar-backend:latest"
          fi

          if [ "$DEPLOY_GAME" = "true" ]; then
            echo "${{ secrets.HOST_ENV_GAME }}" > apps/game/.env;
            if [ -n "$TURN_SECRET" ]; then
              printf 'TURN_SECRET=%s\nTURN_URLS=game.mooncellar.space:3478\n' "$TURN_SECRET" >> apps/game/.env
            fi
            docker build \
              -f apps/game/Dockerfile \
              -t mooncellar-game:latest \
              .
            IMAGES="$IMAGES mooncellar-game:latest"
          fi

          if [ "$DEPLOY_DOCS" = "true" ]; then
            docker build \
              -f static.Dockerfile \
              --build-arg BUILD="bun run docs:build" \
              --build-arg OUT=docs/.vitepress/dist \
              --build-arg PORT=4333 \
              -t mooncellar-docs:latest \
              .
            IMAGES="$IMAGES mooncellar-docs:latest"
          fi

          if [ "$DEPLOY_STORYBOOK" = "true" ]; then
            docker build \
              -f static.Dockerfile \
              --build-arg BUILD="bun --filter web build-storybook" \
              --build-arg OUT=apps/web/storybook-static \
              --build-arg PORT=4222 \
              -t mooncellar-storybook:latest \
              .
            IMAGES="$IMAGES mooncellar-storybook:latest"
          fi

          docker save $IMAGES | gzip > images.tar.gz

      - name: Copy images to server
        if: env.BUILDS_IMAGES == 'true'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "images.tar.gz"
          target: "/tmp/"

      - name: Prepare infra files
        if: needs.changes.outputs.infra == 'true'
        env:
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
        run: |
          echo "${{ secrets.HOST_ENV_INFRA }}" > infra/.env
          if [ -n "$TURN_SECRET" ]; then
            printf 'TURN_SECRET=%s\n' "$TURN_SECRET" >> infra/.env
          fi
          grep -E '^METRICS_TOKEN=' infra/.env | cut -d= -f2- > infra/prometheus/metrics_token
          test -s infra/prometheus/metrics_token

      - name: Copy infra to server
        if: needs.changes.outputs.infra == 'true'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "infra"
          target: "/opt/mooncellar/"

      - name: Deploy on server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_WEB,DEPLOY_API,DEPLOY_GAME,DEPLOY_INFRA,DEPLOY_DOCS,DEPLOY_STORYBOOK
          script: |
            set -e

            docker network inspect mooncellar >/dev/null 2>&1 \
              || docker network create mooncellar

            if [ "$DEPLOY_INFRA" = "true" ]; then
              docker compose -f /opt/mooncellar/infra/docker-compose.prod.yml up -d

              UFW=ufw
              [ "$(id -u)" = 0 ] || UFW="sudo -n ufw"
              if command -v ufw >/dev/null 2>&1 && $UFW status 2>/dev/null | grep -q "Status: active"; then
                $UFW allow 3478/udp >/dev/null && $UFW allow 49160:49200/udp >/dev/null \
                  || echo "ufw: could not open the coturn ports, allow UDP 3478 and 49160:49200 by hand"
              fi

              NGINX_NEW=/opt/mooncellar/infra/nginx/mooncellar.conf
              NGINX_LIVE=/etc/nginx/conf.d/mooncellar.conf
              NGINX_PREV=/etc/nginx/mooncellar.conf.prev

              DOMAINS=$(tr '\n' ' ' < "$NGINX_NEW" | grep -oP '\bserver_name\s+\K[^;]+' \
                | tr -s ' ' '\n' | sort -u | grep . | sed 's/^/-d /' | tr '\n' ' ')
              certbot certonly --nginx --non-interactive \
                --cert-name mooncellar.space \
                --keep-until-expiring --renew-with-new-domains \
                $DOMAINS

              cp "$NGINX_LIVE" "$NGINX_PREV"
              cp "$NGINX_NEW" "$NGINX_LIVE"
              if ! nginx -t; then
                cp "$NGINX_PREV" "$NGINX_LIVE"
                exit 1
              fi
              systemctl reload nginx
            fi

            run_app() {
              docker rm -f "$1" 2>/dev/null || true
              docker run -d \
                --name "$1" \
                --restart always \
                --network mooncellar \
                -p "127.0.0.1:$2:$2" \
                --add-host host.docker.internal:host-gateway \
                --add-host host.containers.internal:host-gateway \
                "$1:latest"
            }

            if [ -f /tmp/images.tar.gz ]; then
              docker load < /tmp/images.tar.gz
              rm /tmp/images.tar.gz
            fi

            if [ "$DEPLOY_WEB" = "true" ]; then
              run_app mooncellar-frontend 3111
            fi

            if [ "$DEPLOY_API" = "true" ]; then
              run_app mooncellar-backend 3228
            fi

            if [ "$DEPLOY_GAME" = "true" ]; then
              run_app mooncellar-game 3229
            fi

            if [ "$DEPLOY_DOCS" = "true" ]; then
              run_app mooncellar-docs 4333
            fi

            if [ "$DEPLOY_STORYBOOK" = "true" ]; then
              run_app mooncellar-storybook 4222
            fi

            docker image prune -f
