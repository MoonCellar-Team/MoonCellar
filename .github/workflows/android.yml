name: Android APK

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    env:
      BUBBLEWRAP_VERSION: "1.25.0"
      BUILD_TOOLS_VERSION: "36.1.0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check tag matches appVersion
        if: github.event_name == 'push'
        run: |
          version=$(jq -r .appVersion twa-manifest.json)
          if [ "${GITHUB_REF_NAME}" != "android-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match appVersion ${version} in twa-manifest.json"
            exit 1
          fi

      - name: Use JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.12"

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-36"
          [ -e "$ANDROID_HOME/bin" ] || ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          mkdir -p ~/.bubblewrap
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$ANDROID_HOME" \
            '{jdkPath: $jdk, androidSdkPath: $sdk}' > ~/.bubblewrap/config.json

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Generate Android project
        run: bunx @bubblewrap/cli@${BUBBLEWRAP_VERSION} update --skipVersionUpgrade < /dev/null

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bunx @bubblewrap/cli@${BUBBLEWRAP_VERSION} build --skipPwaValidation < /dev/null
          mv app-release-signed.apk mooncellar.apk
          sha256sum mooncellar.apk | tee mooncellar.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mooncellar-apk
          path: |
            apps/android/mooncellar.apk
            apps/android/mooncellar.apk.sha256

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat RELEASE.md
            echo
            echo "SHA-256 of \`mooncellar.apk\`: \`$(cut -d' ' -f1 mooncellar.apk.sha256)\`"
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" mooncellar.apk \
            --title "MoonCellar for Android ${GITHUB_REF_NAME#android-v}" \
            --notes-file notes.md

      - name: Remove signing key
        if: always()
        run: rm -f android.keystore
